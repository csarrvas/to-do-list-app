<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tareas</title>
    <script>
      // Applies the theme before the first paint so the wrong one doesn't
      // flash. Mirrors useTheme: the choice saved by redux-persist (key
      // `persist:root`, see src/store/store.ts) or else the system's.
      try {
        const saved = JSON.parse(
          window.localStorage.getItem('persist:root') ?? '{}',
        )
        const preference = saved.theme && JSON.parse(saved.theme).preference
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
        const theme = preference ?? (prefersDark ? 'dark' : 'light')
        document.documentElement.classList.toggle('dark', theme === 'dark')
      } catch {
        // Storage may be blocked; the app applies the theme once it loads
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
