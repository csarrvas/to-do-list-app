name: Commitlint

on:
  pull_request:
    # `edited` re-runs the check when the PR title changes
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional commits
    # `edited` also fires for description edits (e.g. ticking the template
    # checklist); only re-run when the title changed
    if: github.event.action != 'edited' || github.event.changes.title != null
    # Job-level so a skipped run doesn't cancel one in progress
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      # With squash merging the PR title becomes the commit message on main.
      # Passed through env to avoid script injection from the title.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
